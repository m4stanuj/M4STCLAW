[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m4stclaw"
version = "3.5.0"
description = "Autonomous AI Mesh Network — Multi-provider LLM routing with MCP integration"
readme = "README.md"
authors = [
    { name = "M4ST", email = "m4stanuj@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "mcp>=0.1.0",
    "pillow>=10.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.2",
    "composio-core>=0.5.0",
    "playwright>=1.40.0",
    "pytesseract>=0.3.10"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0"
]

[project.scripts]
m4stclaw = "m4stclaw.start:main"

[tool.setuptools]
packages = ["m4stclaw", "m4stclaw.core", "m4stclaw.servers", "m4stclaw.ui"]

[tool.setuptools.package-data]
m4stclaw = ["ui/static/*"]

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]
