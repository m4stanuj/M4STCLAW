name: Windows executable preview

on:
  push:
    branches: ['codex/windows-glass-preview']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'm4stclaw/**'
      - 'assets/m4stclaw-windows.ico'
      - 'scripts/*windows*'
      - 'pyproject.toml'
      - 'start.py'

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.22.3 pywin32==312
      - name: Build the Windows x64 preview
        run: ./scripts/build-windows.ps1
      - name: Smoke-test the frozen entry point
        run: python scripts/smoke-windows.py build/windows/M4STCLAW.exe
