name: Windows executable preview

on:
  push:
    branches: ['codex/windows-glass-preview']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'm4stclaw/**'
      - 'assets/m4stclaw-windows.ico'
      - 'scripts/*windows*'
      - 'pyproject.toml'
      - 'start.py'

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.22.3 pywin32==312 pytest
      - name: Test dashboard authorization and first-run setup
        run: python -m pytest tests/test_dashboard_auth.py -q
      - name: Build the Windows x64 preview
        run: ./scripts/build-windows.ps1
      - name: Smoke-test the frozen entry point
        run: python scripts/smoke-windows.py build/windows/M4STCLAW.exe
      - name: Test interactive first launch in a Windows pseudo-console
        run: |
          python -m pip install pywinpty==3.1.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/smoke-windows-interactive.py build/windows/M4STCLAW.exe
      - name: Build and test the per-user installer
        run: |
          $sourceVersion = python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = [version]$sourceVersion
          $next = [version]::new($version.Major, $version.Minor, ($version.Build + 1))
          ./scripts/build-windows-installer.ps1 -Version $version
          ./scripts/build-windows-installer.ps1 -Version $next
          ./scripts/smoke-windows-installer.ps1 `
            -Installer "build/windows/M4STCLAW-$version-windows-x64-setup.exe" `
            -UpgradeInstaller "build/windows/M4STCLAW-$next-windows-x64-setup.exe" `
            -Version $version -UpgradeVersion $next
