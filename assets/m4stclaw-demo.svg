<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes typing {
      0%, 20% { content: "search trending AI agents 2026"; }
      40%, 60% { content: "agent dispatch 24/7 autonomous loop"; }
      80%, 100% { content: "model deepseek-v4.1-flash"; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 0.9s infinite;
    }
    .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #e2e8f0; }
    .text-cmd { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; fill: #38bdf8; }
    .text-output { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #a7f3d0; }
    .text-dim { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #64748b; }
    .text-prompt { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #fbbf24; }
  </style>

  <!-- Terminal Window Frame -->
  <rect x="10" y="10" width="780" height="400" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="10" y="10" width="780" height="42" rx="14" fill="#0f172a"/>
  <circle cx="35" cy="31" r="6" fill="#ef4444"/>
  <circle cx="55" cy="31" r="6" fill="#f59e0b"/>
  <circle cx="75" cy="31" r="6" fill="#10b981"/>
  
  <text x="400" y="36" text-anchor="middle" class="text-title">⚡ M4STCLAW v5.0 — Autonomous Interactive Console</text>
  
  <!-- Console Banner -->
  <text x="35" y="80" class="text-dim">========================================================================</text>
  <text x="35" y="102" class="text-cmd" font-weight="bold" filter="url(#glow)">⚡ M4STCLAW BAHUBALI EDITION — Powered by NVIDIA NIM H100</text>
  <text x="35" y="124" class="text-output">🟢 AI Cockpit: Active | 🟢 24/7 Engine: Online | 🟢 Stealth Mesh: Connected</text>
  <text x="35" y="146" class="text-dim">------------------------------------------------------------------------</text>

  <!-- Command 1 -->
  <text x="35" y="180" class="text-prompt">M4STCLAW&gt; <tspan class="text-cmd">search trending AI agents 2026</tspan></text>
  <text x="35" y="206" class="text-output">✓ Stealth Search: Found 6 live organic results via rotating headers (0ms wait)</text>
  <text x="35" y="228" class="text-dim">  [1] Scrapling: Undetectable web crawler framework with Turnstile bypass</text>
  <text x="35" y="250" class="text-dim">  [2] Mem0: Production-grade 3-tier memory engine for AI assistants</text>

  <!-- Command 2 -->
  <text x="35" y="290" class="text-prompt">M4STCLAW&gt; <tspan class="text-cmd">agent dispatch "Autonomous Intelligence Sweep"</tspan></text>
  <text x="35" y="316" class="text-output">✓ n8n Webhook: Dispatched to 24/7 loop (Execution ID: m4st_agent_9918)</text>

  <!-- Prompt & Cursor -->
  <text x="35" y="360" class="text-prompt">M4STCLAW&gt; <tspan class="text-cmd">model deepseek-v4.1-flash</tspan><tspan class="cursor" fill="#38bdf8"> █</tspan></text>
  <text x="35" y="386" class="text-output">⚡ Switched to DeepSeek V4.1 Flash (NVIDIA H100 Ultra Reasoning Core)</text>
</svg>
